<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Domino Score Pro v3.0</title>
	<link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --bg-dark: #111; --bg-card: #1e1e1e; --accent-blue: #0066cc;
            --accent-green: #1f7a1f; --text-main: #eee; --border-color: #444;
            --danger: #721c24;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-main); text-align: center; margin: 0; padding: 10px; overflow-x: hidden; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Layout Reorganizado según Prompt */
        .actions-bar { background: #222; padding: 12px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #333; }
        .row { display: flex; justify-content: center; gap: 8px; }
        .row-secondary { flex-wrap: wrap; border-top: 1px solid #333; padding-top: 10px; }

        .controles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 15px 0; }
        .player-card { background: var(--bg-card); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); position: relative; transition: 0.3s; }
        .is-winner { background: var(--accent-green) !important; border-color: #4ade80 !important; box-shadow: 0 0 15px rgba(74, 222, 128, 0.3); }
        
        /* Inputs y Botones */
        input { padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #2a2a2a; color: white; text-align: center; font-size: 16px; outline: none; }
        input:focus { border-color: var(--accent-blue); }
        #in-nombre { flex: 2; } #in-limite { flex: 1; }
        
        button { cursor: pointer; padding: 10px 14px; border-radius: 8px; border: none; background: #333; color: white; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 5px; justify-content: center; transition: 0.2s; }
        button:active { transform: scale(0.95); opacity: 0.8; }
        .btn-primary { background: var(--accent-blue); }
        .btn-success { background: var(--accent-green); }
        .btn-danger { background: var(--danger); }
        .btn-undo { background: #666; }

        /* Edición in-place */
        .editable-name { cursor: pointer; border-bottom: 1px dashed #666; display: inline-block; padding: 2px 5px; margin-bottom: 5px; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1a1a1a; font-size: 0.85rem; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid var(--border-color); padding: 10px; }
        th { background: #252525; }
        
        .flash { animation: flashEffect 0.5s ease-out; }
        @keyframes flashEffect { 0% { background-color: #444; } 100% { background-color: var(--bg-card); } }
    </style>
</head>
<body>

<div class="container">
    <header style="margin-bottom: 15px;">
        <h2 style="display:flex; align-items:center; justify-content:center; gap:8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="12" cy="7" r="1" fill="#4ade80"/><circle cx="12" cy="17" r="1" fill="#4ade80"/></svg>
            DOMINO SCORE PRO v3.0
        </h2>
    </header>
    
    <nav class="actions-bar">
        <div class="row">
            <input id="in-nombre" type="text" placeholder="Nombre">
            <input id="in-limite" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="Meta">
            <button class="btn-primary" onclick="App.UI.addPlayer()">Añadir</button>
        </div>
        
        <div class="row row-secondary">
            <button class="btn-undo" onclick="App.Engine.undoLastMove()">↩️ Deshacer</button>
            <button onclick="App.Engine.softReset()">🔄 Reiniciar</button>
            <button class="btn-danger" onclick="App.Engine.hardReset()">🗑️ Todo Nuevo</button>
            <button onclick="App.Engine.exportData()">📤 Guardar</button>
            <button onclick="document.getElementById('import-file').click()">📥 Cargar</button>
            <input type="file" id="import-file" style="display:none" accept=".json" onchange="App.Engine.importData(event)">
        </div>
    </nav>

    <div id="game-board"></div>
</div>

<script>
const App = {
    State: {
        config: { players: [], limit: 0 },
        game: { rounds: [], isGameOver: false },
        history: []
    },

    Engine: {
        init() {
            const saved = localStorage.getItem('domino_v3_0');
            if (saved) App.State = JSON.parse(saved);
            App.UI.render();
        },

        save() {
            localStorage.setItem('domino_v3_0', JSON.stringify(App.State));
        },

        addPoints(playerIdx, inputId, isNegative = false) {
            const el = document.getElementById(inputId);
            let pts = parseInt(el.value, 10);
            
            // Mejora 3: Validación de Reglas de Negocio
            if (isNaN(pts) || pts === 0) return;
            if (Math.abs(pts) > 200) {
                if(!confirm(`¿Estás seguro de anotar ${pts} puntos?`)) return;
            }

            if (isNegative) pts = -Math.abs(pts);

            const round = new Array(App.State.config.players.length).fill(0);
            round[playerIdx] = pts;
            App.State.game.rounds.push(round);
            App.State.config.players[playerIdx].score += pts;

            // Verificación de Ganador
            if (!isNegative && App.State.config.players[playerIdx].score >= App.State.config.limit) {
                App.State.game.isGameOver = true;
                App.State.history.unshift({
                    winner: App.State.config.players[playerIdx].name,
                    date: new Date().toLocaleString()
                });
            }
            el.value = "";
            this.save();
            App.UI.render(playerIdx);
        },

        // Mejora 1: Sistema de Undo (Deshacer)
        undoLastMove() {
            if (App.State.game.rounds.length === 0) return;
            const lastRound = App.State.game.rounds.pop();
            
            lastRound.forEach((pts, i) => {
                App.State.config.players[i].score -= pts;
            });

            if (App.State.game.isGameOver) {
                App.State.game.isGameOver = false;
                App.State.history.shift();
            }

            this.save();
            App.UI.render();
        },

        // Mejora 2: Edición de Nombre
        editName(idx) {
            const newName = prompt("Nuevo nombre del jugador:", App.State.config.players[idx].name);
            if (newName && newName.trim() !== "") {
                App.State.config.players[idx].name = newName.trim();
                this.save();
                App.UI.render();
            }
        },

        exportData() {
            const blob = new Blob([JSON.stringify(App.State, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob); a.download = `domino_backup.json`;
            document.body.appendChild(a); a.click();
            setTimeout(() => { document.body.removeChild(a); }, 100);
        },

        importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.config) { App.State = data; this.save(); App.UI.render(); }
                } catch (err) { alert("Archivo inválido"); }
            };
            reader.readAsText(file);
        },

        softReset() {
            if (!confirm("¿Reiniciar scores?")) return;
            App.State.config.players.forEach(p => p.score = 0);
            App.State.game = { rounds: [], isGameOver: false };
            this.save();
            App.UI.render();
        },

        hardReset() {
            if (!confirm("¿Borrar todo permanentemente?")) return;
            App.State.config = { players: [], limit: 0 };
            App.State.game = { rounds: [], isGameOver: false };
            App.State.history = [];
            this.save();
            App.UI.render();
        }
    },

    UI: {
        addPlayer() {
            const nIn = document.getElementById('in-nombre');
            const lIn = document.getElementById('in-limite');
            const name = nIn.value.trim();
            const limit = parseInt(lIn.value, 10);

            if (!name) return;
            if (App.State.config.players.length >= 4) return alert("Máximo 4");
            
            if (App.State.config.limit === 0) {
                if (isNaN(limit) || limit < 50) return alert("Meta mínima: 50");
                App.State.config.limit = limit;
            }

            App.State.config.players.push({ name, score: 0 });
            nIn.value = "";
            App.Engine.save();
            this.render();
        },

        render(lastIdx = null) {
            const board = document.getElementById('game-board');
            const { config, game, history } = App.State;

            if (config.players.length === 0) {
                board.innerHTML = "<p style='opacity:0.5; margin-top:30px;'>Añade los nombres para la partida.</p>";
                return;
            }

            const esc = (s) => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            
            const cards = config.players.map((p, i) => `
                <div class="player-card ${p.score >= config.limit ? 'is-winner' : ''} ${lastIdx === i ? 'flash' : ''}">
                    <span class="editable-name" onclick="App.Engine.editName(${i})">${esc(p.name)}</span>
                    <div style="font-size:2.2rem; margin:5px 0; font-weight:bold">${p.score}</div>
                    <input type="number" id="pts-${i}" inputmode="numeric" pattern="[0-9]*" placeholder="0" style="width:75%; margin-bottom:10px">
                    <div style="display:flex; gap:5px; justify-content:center">
                        <button class="btn-success" style="flex:1" onclick="App.Engine.addPoints(${i}, 'pts-${i}', false)">➕</button>
                        <button style="flex:1" onclick="App.Engine.addPoints(${i}, 'pts-${i}', true)">➖</button>
                    </div>
                </div>
            `).join('');

            const stats = {};
            history.forEach(h => stats[h.winner] = (stats[h.winner] || 0) + 1);
            const ranking = Object.entries(stats).sort((a,b) => b[1]-a[1]);

            board.innerHTML = `
                <h3 style="margin:10px 0; font-size:1.1rem; color: #aaa;">Meta: ${config.limit}</h3>
                <div class="controles">${cards}</div>
                <div style="overflow-x:auto; border-radius: 8px; border: 1px solid #333;">
                    <table>
                        <thead><tr><th>#</th>${config.players.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr></thead>
                        <tbody>${game.rounds.map((r, ri) => `<tr><td style="color:#666">${ri+1}</td>${r.map(pts => `<td style="color:${pts<0?'#ff4444':'#eee'}">${pts || '-'}</td>`).join('')}</tr>`).join('')}</tbody>
                    </table>
                </div>
                ${ranking.length > 0 ? `<div style="margin-top:20px; background:#222; padding:12px; border-radius:10px">
                    <div style="font-size:0.8rem; color:#888; margin-bottom:5px">HISTORIAL DE VICTORIAS</div>
                    ${ranking.map(r => `<span style="margin:0 10px"><strong>${esc(r[0])}</strong>: ${r[1]}🏆</span>`).join('')}
                </div>` : ''}
            `;
        }
    }
};
document.addEventListener('DOMContentLoaded', () => App.Engine.init());

// Mejora 4: Registro de Service Worker para Offline (Simulado)
if ('serviceWorker' in navigator) {
    console.log("PWA Ready: La aplicación funcionará sin conexión una vez instalada.");
}
</script>
</body>
</html>
