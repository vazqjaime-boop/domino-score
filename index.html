<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Domino Score Pro v2.8</title>
	<link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --bg-dark: #111; --bg-card: #1e1e1e; --accent-blue: #0066cc;
            --accent-green: #1f7a1f; --text-main: #eee; --border-color: #444;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg-dark); color: var(--text-main); text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Reorganización de la barra de acciones */
        .actions-bar { background: #222; padding: 12px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; justify-content: center; gap: 8px; flex-wrap: nowrap; }
        .row-secondary { flex-wrap: wrap; border-top: 1px solid #333; pt: 10px; padding-top: 10px; }

        .controles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 15px 0; }
        .player-card { background: var(--bg-card); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); }
        .is-winner { background: var(--accent-green) !important; border-color: #4ade80 !important; }
        
        input { padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #2a2a2a; color: white; text-align: center; font-size: 16px; }
        #in-nombre { flex: 2; min-width: 80px; }
        #in-limite { flex: 1; min-width: 60px; }
        
        button { cursor: pointer; padding: 10px 14px; border-radius: 8px; border: none; background: #333; color: white; font-weight: 600; font-size: 14px; }
        .btn-primary { background: var(--accent-blue); flex: 1; }
        .btn-success { background: var(--accent-green); }
        .btn-danger { background: #721c24; }
        .btn-backup { background: #444; font-size: 12px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1a1a1a; font-size: 0.9rem; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: center; }
        .flash { animation: flashEffect 0.4s ease-out; }
        @keyframes flashEffect { 0% { background-color: #555; } 100% { background-color: var(--bg-card); } }
    </style>
</head>
<body>

<div class="container">
    <header style="margin-bottom: 15px;">
        <h2 style="display:flex; align-items:center; justify-content:center; gap:8px; font-size: 1.2rem;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="12" cy="7" r="1" fill="#4ade80"/><circle cx="12" cy="17" r="1" fill="#4ade80"/></svg>
            DOMINO SCORE PRO
        </h2>
    </header>
    
    <nav class="actions-bar">
        <div class="row">
            <input id="in-nombre" type="text" placeholder="Nombre">
            <input id="in-limite" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="Meta">
            <button class="btn-primary" onclick="App.UI.addPlayer()">Añadir</button>
        </div>
        
        <div class="row row-secondary">
            <button onclick="App.Engine.softReset()">🔄 Reiniciar</button>
            <button class="btn-danger" onclick="App.Engine.hardReset()">🗑️ Borrar Todo</button>
            <button class="btn-backup" onclick="App.Engine.exportData()">📤 Guardar</button>
            <button class="btn-backup" onclick="document.getElementById('import-file').click()">📥 Cargar</button>
            <input type="file" id="import-file" style="display:none" accept=".json" onchange="App.Engine.importData(event)">
        </div>
    </nav>

    <div id="game-board"></div>
</div>

<script>
const App = {
    State: {
        config: { players: [], limit: 0 },
        game: { rounds: [], isGameOver: false },
        history: []
    },

    Engine: {
        init() {
            const saved = localStorage.getItem('domino_v2_8');
            if (saved) App.State = JSON.parse(saved);
            App.UI.render();
        },

        save() {
            localStorage.setItem('domino_v2_8', JSON.stringify(App.State));
        },

        addPoints(playerIdx, inputId, isNegative = false) {
            const el = document.getElementById(inputId);
            let pts = parseInt(el.value, 10);
            if (App.State.game.isGameOver || isNaN(pts) || pts === 0) return;

            if (isNegative) pts = -Math.abs(pts);

            const round = new Array(App.State.config.players.length).fill(0);
            round[playerIdx] = pts;
            App.State.game.rounds.push(round);
            App.State.config.players[playerIdx].score += pts;

            if (!isNegative && App.State.config.players[playerIdx].score >= App.State.config.limit) {
                App.State.game.isGameOver = true;
                App.State.history.unshift({
                    winner: App.State.config.players[playerIdx].name,
                    date: new Date().toLocaleString()
                });
            }
            el.value = "";
            this.save();
            App.UI.render(playerIdx);
        },

        exportData() {
            try {
                const blob = new Blob([JSON.stringify(App.State, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = `domino_respaldo.json`;
                document.body.appendChild(a); a.click();
                setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
            } catch (e) { alert("Error al exportar"); }
        },

        importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.config) { App.State = data; this.save(); App.UI.render(); }
                } catch (err) { alert("Archivo inválido"); }
            };
            reader.readAsText(file);
        },

        softReset() {
            if (!confirm("¿Reiniciar puntos?")) return;
            App.State.config.players.forEach(p => p.score = 0);
            App.State.game = { rounds: [], isGameOver: false };
            this.save();
            App.UI.render();
        },

        hardReset() {
            if (!confirm("¿Borrar todo?")) return;
            App.State.config = { players: [], limit: 0 };
            App.State.game = { rounds: [], isGameOver: false };
            App.State.history = [];
            this.save();
            App.UI.render();
        }
    },

    UI: {
        addPlayer() {
            const nIn = document.getElementById('in-nombre');
            const lIn = document.getElementById('in-limite');
            const name = nIn.value.trim();
            const limit = parseInt(lIn.value, 10);

            if (!name) return;
            if (App.State.config.players.length >= 4) return alert("Máximo 4");
            if (App.State.config.limit === 0) {
                if (isNaN(limit) || limit <= 0) return alert("Define Meta");
                App.State.config.limit = limit;
            }

            App.State.config.players.push({ name, score: 0 });
            nIn.value = "";
            App.Engine.save();
            this.render();
        },

        render(lastIdx = null) {
            const board = document.getElementById('game-board');
            const { config, game, history } = App.State;

            if (config.players.length === 0) {
                board.innerHTML = "<p style='opacity:0.5; margin-top:20px;'>Añade jugadores.</p>";
                return;
            }

            const esc = (s) => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            
            const cards = config.players.map((p, i) => `
                <div class="player-card ${p.score >= config.limit ? 'is-winner' : ''} ${lastIdx === i ? 'flash' : ''}">
                    <div style="font-weight:bold; font-size: 0.9rem;">${esc(p.name)}</div>
                    <div style="font-size:1.8rem; margin:5px 0">${p.score}</div>
                    <input type="number" id="pts-${i}" inputmode="numeric" pattern="[0-9]*" placeholder="0" style="width:70%;">
                    <div style="margin-top:8px; display:flex; gap:4px; justify-content:center">
                        <button class="btn-success" onclick="App.Engine.addPoints(${i}, 'pts-${i}', false)">➕</button>
                        <button onclick="App.Engine.addPoints(${i}, 'pts-${i}', true)">➖</button>
                    </div>
                </div>
            `).join('');

            const stats = {};
            history.forEach(h => stats[h.winner] = (stats[h.winner] || 0) + 1);
            const ranking = Object.entries(stats).sort((a,b) => b[1]-a[1]);

            board.innerHTML = `
                <h3 style="margin:10px 0; font-size:1rem;">Meta: ${config.limit}</h3>
                <div class="controles">${cards}</div>
                <div style="overflow-x:auto">
                    <table>
                        <thead><tr><th>R</th>${config.players.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr></thead>
                        <tbody>${game.rounds.map((r, ri) => `<tr><td>${ri+1}</td>${r.map(pts => `<td>${pts || '-'}</td>`).join('')}</tr>`).join('')}</tbody>
                    </table>
                </div>
                ${ranking.length > 0 ? `<div style="margin-top:15px; background:#222; padding:10px; border-radius:8px; font-size:0.85rem">
                    <strong>🏆 Ranking:</strong> ${ranking.map(r => `${esc(r[0])}(${r[1]})`).join(' | ')}
                </div>` : ''}
            `;
        }
    }
};
document.addEventListener('DOMContentLoaded', () => App.Engine.init());
</script>
</body>
</html>
