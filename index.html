<!DOCTYPE html>
<html>
<head>
  <title>Domino Score</title>

  <link rel="manifest" href="manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="ficha.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    table {
      width: auto;
      margin: 20px auto;
      border-collapse: collapse;
      background: #222;
    }

    th, td {
      border: 1px solid #444;
      padding: 6px 10px;
      text-align: center;
    }

    th {
      background: #333;
    }

    tr:nth-child(even) {
      background: #1a1a1a;
    }

    .app {
      display: inline-block;
    }

    .controles {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      max-width: 650px;
      margin: 0 auto;
    }

    .control {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 12px;
      width: 150px;
      transition: 0.2s;
      position: relative;
      z-index: 1;
    }

    .control.ganador {
      background: #1f7a1f;
      z-index: 10;
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0,255,0,0.4);
    }

    .control input {
      width: 90%;
      padding: 6px;
      border-radius: 6px;
      border: none;
      text-align: center;
    }

    .control p {
      margin: 10px 0;
      font-size: 18px;
    }

    .control button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: #333;
      color: white;
      font-size: 16px;
    }

    .control button:hover {
      background: #555;
    }

@keyframes aparecer {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.control {
  animation: aparecer 0.3s ease;
}
.flash {
  animation: flash 0.3s;
}

@keyframes flash {
  0% { background: #444; }
  100% { background: transparent; }
}
let card = document.querySelectorAll(".control")[index];
card.classList.add("flash");

setTimeout(() => {
  card.classList.remove("flash");
}, 300);	

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.slide {
  animation: slideIn 0.3s ease;
}

tr:last-child {
  animation: slideIn 0.3s ease;
}	
  </style>
</head>

<body>

<h2>
  <img src="ficha.png" alt="Domino" style="width:30px; vertical-align:middle; margin-right:8px;">
  Domino Score
</h2>
<h3 id="ganador" style="color: lightgreen;"></h3>

<input id="nombre" placeholder="Jugador">
<input id="limite" type="number" placeholder="Meta (ej:100)">
<button onclick="agregarJugador()">Agregar</button>
<button onclick="nuevaPartida()">Nueva partida</button>
<button onclick="borrarHistorial()">Borrar historial</button>

<div id="jugadores"></div>

<script>
let jugadores = [];
let limite = 0;
let juegoTerminado = false;
let rondas = [];
let historial = [];
let activarSlide = false;

// ---------------- GUARDAR ----------------

function guardarDatos() {
  localStorage.setItem("jugadores", JSON.stringify(jugadores));
  localStorage.setItem("rondas", JSON.stringify(rondas));
  localStorage.setItem("limite", limite);
  localStorage.setItem("juegoTerminado", juegoTerminado);
}

function guardarHistorial() {
  localStorage.setItem("historial", JSON.stringify(historial));
}

// ---------------- CARGAR ----------------

function cargarDatos() {
  let j = localStorage.getItem("jugadores");
  let r = localStorage.getItem("rondas");
  let l = localStorage.getItem("limite");
  let t = localStorage.getItem("juegoTerminado");
  let h = localStorage.getItem("historial");

  if (j) jugadores = JSON.parse(j);
  if (r) rondas = JSON.parse(r);
  if (l) limite = parseInt(l);
  if (t) juegoTerminado = JSON.parse(t);
  if (h) historial = JSON.parse(h);

  mostrar();
}

// ---------------- JUGADORES ----------------

function agregarJugador() {
  let nombre = document.getElementById("nombre").value;
  let inputLimite = document.getElementById("limite").value;

  if (!nombre) return;

  if (jugadores.length >= 4) {
    alert("Máximo 4 jugadores");
    return;
  }

  if (limite === 0) {
    limite = parseInt(inputLimite);
    if (isNaN(limite) || limite <= 0) {
      alert("Pon un límite válido");
      return;
    }
  }

  jugadores.push({nombre: nombre, puntos: 0});
  guardarDatos();

  document.getElementById("nombre").value = "";
  mostrar();
}

function editarNombre(index, nuevoNombre) {
  if (!nuevoNombre) return;
  jugadores[index].nombre = nuevoNombre;
  guardarDatos();
  mostrar();
}

// ---------------- PUNTOS ----------------

function sumar(index) {
  if (juegoTerminado) return;

  let valor = parseInt(document.getElementById("input" + index).value);
  if (isNaN(valor) || valor <= 0) return;

  // 👇 ANIMACIÓN
  let card = document.querySelectorAll(".control")[index];
  card.classList.add("flash");

  setTimeout(() => {
    card.classList.remove("flash");
  }, 300);

  nuevaRonda(index, valor);
}

function restar(index) {
  if (juegoTerminado) return;

  let valor = parseInt(document.getElementById("input" + index).value);
  if (isNaN(valor) || valor <= 0) return;

  // 👇 ANIMACIÓN
  let card = document.querySelectorAll(".control")[index];
  card.classList.add("flash");

  setTimeout(() => {
    card.classList.remove("flash");
  }, 300);

  nuevaRonda(index, -valor);
}

// ---------------- RONDAS ----------------

function nuevaRonda(jugadorIndex, puntos) {
  let ronda = [];

  for (let i = 0; i < jugadores.length; i++) {
    if (i === jugadorIndex) {
      ronda.push(puntos);
      jugadores[i].puntos += puntos;
    } else {
      ronda.push(0);
    }
  }

  rondas.push(ronda);
  guardarDatos();

  if (jugadores[jugadorIndex].puntos >= limite) {
    juegoTerminado = true;

    let partida = {
      ganador: jugadores[jugadorIndex].nombre,
      fecha: new Date().toLocaleString()
    };

    historial.push(partida);
    guardarHistorial();

    document.getElementById("ganador").innerText =
      "🏆 Ganó " + jugadores[jugadorIndex].nombre;
  }
  
  activarSlide = true;

  mostrar();
}

// ---------------- MOSTRAR ----------------

function mostrar() {
  let contenedor = document.getElementById("jugadores");
  let claseSlide = activarSlide ? "slide" : "";
  activarSlide = false;

  if (jugadores.length === 0) {
    contenedor.innerHTML = "<p>No hay jugadores aún</p>";
    return;
  }

  let encabezado = "<tr><th>Ronda</th>";
  jugadores.forEach(j => {
    encabezado += `<th>${j.nombre}</th>`;
  });
  encabezado += "</tr>";

  let filas = "";

  if (rondas.length === 0) {
    filas = `<tr><td colspan="${jugadores.length + 1}">Sin rondas aún</td></tr>`;
  } else {
    rondas.forEach((r, index) => {
      filas += `<tr><td>R${index + 1}</td>`;
      r.forEach(p => {
        filas += `<td>${p}</td>`;
      });
      filas += "</tr>";
    });
  }

  let maxPuntos = Math.max(...jugadores.map(j => j.puntos));

  let controles = jugadores.map((j, i) => {
    let esGanador = j.puntos >= limite;
    let esLider = j.puntos === maxPuntos && maxPuntos > 0;

    return `
      <div class="control ${esGanador ? 'ganador' : ''}">
        ${esLider && !esGanador ? `<div>🥇 LÍDER</div>` : ''}
        ${esGanador ? `<div>🏆 GANADOR</div>` : ''}

        <input value="${j.nombre}" onchange="editarNombre(${i}, this.value)">
        <p>${j.puntos} pts</p>

        <input id="input${i}" type="number" placeholder="Puntos">

        <button onclick="sumar(${i})">➕</button>
        <button onclick="restar(${i})">➖</button>
      </div>
    `;
  }).join("");

  let historialHTML = "<h3>Historial</h3>";
  
  let stats = {};

historial.forEach(p => {
  if (!stats[p.ganador]) {
    stats[p.ganador] = 0;
  }
  stats[p.ganador]++;
});

let ranking = Object.entries(stats)
  .sort((a, b) => b[1] - a[1]);

let statsHTML = "<h3>🏆 Ranking</h3>";

if (ranking.length === 0) {
  statsHTML += "<p>No hay datos</p>";
} else {
  ranking.forEach((item, index) => {
    let medal = "";
    if (index === 0) medal = "🥇";
    else if (index === 1) medal = "🥈";
    else if (index === 2) medal = "🥉";

    statsHTML += `<p>${medal} ${item[0]} - ${item[1]} wins</p>`;
  });
}

  if (historial.length === 0) {
    historialHTML += "<p>No hay partidas aún</p>";
  } else {
    historial.forEach(p => {
      historialHTML += `
        <div style="background:#222; margin:5px; padding:5px; border-radius:8px;">
          🏆 ${p.ganador}<br>
          ${p.fecha}
        </div>
      `;
    });
  }

  
contenedor.innerHTML = `
    <h3>Meta: ${limite}</h3>

    <div class="app">
    <div class="controles">
        ${controles}
    </div>

	<div id="tablaRondas" class="${claseSlide}">
	<table>
	
    ${encabezado}
    ${filas}
	</table>
	</div>

      ${historialHTML}
	  ${statsHTML}
    </div>
  `;
}

// ---------------- NUEVA PARTIDA ----------------

function nuevaPartida() {
  localStorage.removeItem("jugadores");
  localStorage.removeItem("rondas");
  localStorage.removeItem("limite");
  localStorage.removeItem("juegoTerminado");

  jugadores = [];
  rondas = [];
  limite = 0;
  juegoTerminado = false;

  document.getElementById("ganador").innerText = "";

  mostrar();
}

// ---------------- BORRAR HISTORIAL ----------------

function borrarHistorial() {
  if (!confirm("¿Borrar todo el historial?")) return;

  historial = [];
  localStorage.removeItem("historial");

  mostrar();
}

// ---------------- INICIO ----------------

cargarDatos();
</script>

</body>
</html>
